<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail Notify 設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Gmail Notify 設定</h1>
    <form id="settings-form">
      <label class="field">
        <span>チェック間隔</span>
        <select id="intervalMinutes" name="intervalMinutes" disabled></select>
      </label>
      <label class="field">
        <input id="notificationsEnabled" name="notificationsEnabled" type="checkbox" disabled />
        <span>新着メールを通知する</span>
      </label>
      <label class="field">
        <input id="gmailEnabled" name="gmailEnabled" type="checkbox" disabled />
        <span>Gmail を確認する</span>
      </label>
      <label class="field">
        <input id="icloudEnabled" name="icloudEnabled" type="checkbox" disabled />
        <span>iCloud メールを確認する</span>
      </label>
    </form>
    <p id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
